name: Build with Pixi

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: ubuntu-24.04
          - os: ubuntu-24.04-arm
            label: ubuntu-24.04-aarch64
          - os: macos-14
            label: macos-14-arm64
          - os: macos-15-intel
            label: macos-x64
          - os: windows-latest
            label: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pixi and project environment
        uses: prefix-dev/setup-pixi@v0.9.2
        with:
          pixi-version: v0.63.2
          cache: true

      - name: Configure and build
        run: pixi run full-build

      - name: Install into environment
        run: pixi run install

      - name: Verify Python import (netgen)
        run: pixi run test-import

