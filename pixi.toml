[workspace]
name = "netgen"
version = "6.2"
description = "Automatic 3d tetrahedral mesh generator with Python interface"
authors = ["The Netgen team"]
license = "LGPL-2.1-only"
readme = "README.md"
homepage = "https://ngsolve.org"
repository = "https://github.com/NGSolve/netgen"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]

[dependencies]
# Build & runtime (CMake, C++17)
cmake = ">=3.16"
ninja = ">=1.10"
# C++ compiler (conda-forge metapackage)
cxx-compiler = ">=1.0"
# Core libraries
zlib = ">=1.2"
# OpenCascade geometry kernel (required for USE_OCC)
occt = ">=7.6"
# Python & bindings
python = ">=3.9,<3.13"
pybind11 = ">=2.10"
numpy = ">=1.20"
# GUI (Tcl/Tk, OpenGL, X11 on Linux)
tk = ">=8.6"
# Tests
pytest = ">=7.0"

[pypi-dependencies]
# Für Stub-Generierung (Autocomplete) im Python-Build
pybind11-stubgen = ">=2.5"

[target.linux-64.dependencies]
# X11 and OpenGL for GUI on Linux
xorg-libx11 = ">=1.8"
xorg-libxext = ">=1.3"
xorg-libxmu = ">=1.1"
mesalib = ">=21.0"

[tasks]
# Konfiguration mit CMake (pybind11 + OCC von conda-forge)
config = "cmake -B build -G Ninja -DUSE_SUPERBUILD=OFF -DUSE_OCC=ON -DUSE_GUI=ON -DUSE_PYTHON=ON -DUSE_NATIVE_ARCH=OFF -DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX -DCMAKE_PREFIX_PATH=$CONDA_PREFIX -DPython3_ROOT_DIR=$CONDA_PREFIX -DOpenCascade_DIR=$CONDA_PREFIX/lib/cmake/opencascade"
# Build
build = "cmake --build build"
# Install (lokal in build/install oder PREFIX)
install = "cmake --install build --prefix $CONDA_PREFIX"
# Tests
test = "pytest tests/ -v"

[tasks.full-build]
# Vollständiger Build inkl. Konfiguration
depends-on = ["config", "build"]
